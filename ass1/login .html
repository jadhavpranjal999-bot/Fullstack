<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up Page</title>
 

<style>
    *{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#4CAF50;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
width:350px;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

h2{
text-align:center;
margin-bottom:20px;
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:10px;
margin-top:20px;
background:#4CAF50;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#2E7D32;
}

p{
text-align:center;
margin-top:15px;
}

a{
text-decoration:none;
color:blue;
}
</style> 
</head>

<body>

<div class="container">

<h2>Create Account</h2>

<form action="home.html">

<label>Full Name</label>

<input type="text" placeholder="Enter your name" required>

<label>Email</label>
<input type="email" placeholder="Enter your email" required>

<label>Password</label>
<input type="password" placeholder="Enter password" required>

<label>Confirm Password</label>
<input type="password" placeholder="Confirm password" required>

<button type="submit">Sign Up</button>

</form>

<p>Already have an account?
<a href="#">Login</a>
</p>

</div>

</body>
</html>
